<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Salon Appointments</title>
<link rel="stylesheet" href="css/app.css">

</head>
<body>
<header>
  <button class="menu-btn" id="menuBtn">&#9776;</button>
  <h1>Salon Appointments</h1>
  <button class="gear-btn" id="settingsBtn">&#9881;</button>
</header>
<div class="container">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="sidebar" id="sidebar">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Search by name..." autofocus>
    </div>
    <div class="client-count"><span id="visibleCount">0</span> / <span id="totalCount">0</span> clients</div>
    <div class="client-list" id="clientList"></div>
  </div>
  <div class="main">
    <div class="detail-panel" id="detailPanel">
      <div class="top-row">
        <div class="left">
          <button class="btn-back" id="backBtn" style="display:none">&larr; All Appointments</button>
          <div class="client-name" id="detailName">All Appointments</div>
          <div class="client-info" id="detailInfo"></div>
          <div id="detailLeftActions" style="display:inline-flex;align-items:center;gap:6px"></div>
        </div>
        <div class="right" id="detailRight">
          <button class="btn-new-appt" id="newApptBtn">+ New Appointment</button>
        </div>
      </div>
    </div>
    <div class="calendar-header" id="calHeader">
      <div class="nav-row">
        <div class="nav">
          <button id="prevBtn">&larr;</button>
          <span class="title" id="calTitle"></span>
          <button id="nextBtn">&rarr;</button>
        </div>
        <div class="btn-group">
          <button id="todayBtn">Today</button>
          <label class="date-picker-label">
            <span class="dp-text icon-only">&#128197;</span>
            <input type="date" id="datePicker">
          </label>
        </div>
      </div>
      <div class="controls-row">
        <div class="view-toggle">
          <button id="weekViewBtn">Week</button>
          <button id="dayViewBtn" class="active">Day</button>
        </div>
        <button id="callListBtn" class="call-list-btn" title="Tomorrow.s appointments">&#128222; Call List</button>
        <select class="stylist-filter" id="stylistFilter" title="Filter by stylist"><option value="ALL">All stylists</option></select>
      </div>
    </div>
    <div class="calendar-body" id="calendarBody">
      <div class="loading"><div class="spinner"></div><div>Loading data...</div></div>
    </div>
  </div>
</div>
<div class="settings-overlay" id="settingsOverlay"></div>
<div class="settings-panel" id="settingsPanel">
  <div class="settings-header">
    <h2>Settings</h2>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="btn-save" id="settingsSaveBtn" style="display:none">Save</button>
      <button class="settings-close" id="settingsClose">&times;</button>
    </div>
  </div>
  <div class="settings-body">
    <div class="settings-body-main">
      <div class="settings-section">
        <h3>Site Name</h3>
        <input type="text" id="siteNameInput" style="width:100%;padding:8px;border:1px solid #d2d2d7;border-radius:6px;font-size:14px;font-family:inherit;box-sizing:border-box" placeholder="Salon Appointments">
      </div>
      <div class="settings-section">
        <h3>Appearance</h3>
        <div style="display:flex;gap:6px" id="themeToggle">
          <button class="theme-opt active" data-theme-pref="auto">Auto</button>
          <button class="theme-opt" data-theme-pref="light">Light</button>
          <button class="theme-opt" data-theme-pref="dark">Dark</button>
        </div>
      </div>
      <div class="settings-section">
        <h3 class="accordion-toggle" id="svcTypeAccordionToggle">&#9654; Service Types</h3>
        <div class="accordion-content" id="svcTypeAccordionContent" style="display:none">
          <div id="serviceTypeList"></div>
          <div style="margin-top:8px"><button class="btn-save" id="addSvcTypeBtn" style="font-size:12px;padding:4px 10px">+ New Service Type</button></div>
          <span class="save-status" id="svcTypeStatus"></span>
        </div>
      </div>
      <div class="settings-section">
        <h3 class="accordion-toggle" id="stylistAccordionToggle">&#9654; Stylists</h3>
        <div class="accordion-content" id="stylistAccordionContent" style="display:none">
          <div id="stylistList"></div>
          <span class="save-status" id="stylistStatus"></span>
        </div>
      </div>
      <div class="settings-section">
        <h3 class="accordion-toggle" id="productAccordionToggle">&#9654; Products</h3>
        <div class="accordion-content" id="productAccordionContent" style="display:none">
          <div id="productList"></div>
          <span class="save-status" id="productStatus"></span>
        </div>
      </div>
    </div>
    <div style="margin-top:auto;border-top:1px solid #e8e8ed;padding-top:12px;display:flex;justify-content:space-between;align-items:center">
      <button class="btn-save" id="backupBtn" style="font-size:13px;padding:6px 12px">💾 Backup</button>
      <a href="?revisions" style="color:#0071e3;text-decoration:none;font-size:14px;font-weight:500">🕒 History</a>
    </div>
  </div>
</div>
<div class="modal-overlay" id="apptModalOverlay"></div>
<div class="modal-panel" id="apptModal">
  <div class="modal-header">
    <h2>Appointment Details</h2>
    <button class="btn-view-all header-view-all" id="modalViewAll">View All Appointments</button>
    <button class="modal-close" id="modalClose">&times;</button>
  </div>
  <div class="modal-body" id="modalBody"></div>
</div>
<div class="modal-overlay" id="callListOverlay"></div>
<div class="modal-panel" id="callListModal">
  <div class="modal-header has-nav">
    <button class="modal-nav call-nav-prev" id="callListPrev" title="Previous day">&larr;</button>
    <h2 id="callListTitle">Call List</h2>
    <button class="modal-nav call-nav-next" id="callListNext" title="Next day">&rarr;</button>
    <button class="modal-close" id="callListClose">&times;</button>
  </div>
  <div class="modal-body" id="callListBody"></div>
</div>
<script src="js/app.js"></script>

</body>
</html>
